name: Actualizar precios

on:
  workflow_dispatch: {}        # lo lanza cron-job.org cada 30 min
  schedule:
    - cron: '23 * * * *'       # respaldo: cada hora por si cron-job.org falla

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Descargar precios del Ministerio
        run: node scripts/update.mjs

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "precios: $(node -p "require('./data/resumen.json').fecha")"
            git pull --rebase --autostash
            git push
          fi
